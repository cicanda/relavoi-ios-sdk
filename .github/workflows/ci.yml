name: CI

on:
  push:
    branches: [main, develop]
    # Release tags run the full suite too, and gate on the version check below.
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  swift-build:
    # Host (macOS) build. This type-checks everything that is not iOS-only and
    # runs the unit suite. It does NOT cover the iOS-only code: CallKit call
    # detection, ActivityKit Live Activities and the UIKit dialer hand-off all
    # compile out under `#if os(iOS)`, so the ios-simulator job below is what
    # exercises those.
    #
    # Note: `#if canImport(CallKit)` / `#if canImport(ActivityKit)` do NOT guard
    # this. Both modules import fine on macOS; it is the types inside them that
    # are `@available(macOS, unavailable)`. Package.swift declares a macOS
    # platform purely so this job gets a modern deployment target.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: swift build
        run: swift build -v

      - name: swift test
        run: swift test -v

  ios-simulator:
    # Heavier job: runs the test target against an iPhone simulator so the
    # UIKit / CallKit / ActivityKit code paths get compiled and exercised for
    # real on the product platform.
    runs-on: macos-latest
    needs: swift-build
    # Pull requests, every push to main, and every release tag.
    #
    # It used to be pull requests only, and nothing in these repositories
    # opens one: work lands by pushing to main. So the job that the comment
    # above calls "what exercises those" had never run once, and the iOS-only
    # code had never been compiled by CI at all.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: List available simulators
        run: xcrun simctl list devices available

      # Destinations are resolved by UDID discovered at runtime rather than by
      # `name=iPhone <n>,OS=latest`. The runner image decides which device
      # *instances* are pre-created, and that set moves with every Xcode bump:
      # a name that exists today disappears later, and a device *type* being
      # listed does not mean an instance of it exists. Taking the first
      # available iPhone under an iOS runtime cannot go stale. These are
      # host-agnostic unit tests, so the specific model does not matter.
      - name: xcodebuild test
        run: |
          set -euo pipefail

          udid=$(xcrun simctl list devices available | awk '
            /^-- iOS/ { in_ios = 1; next }
            /^-- /    { in_ios = 0 }
            in_ios && /iPhone/ && match($0, /\(([0-9A-Fa-f-]{36})\)/) {
              print substr($0, RSTART + 1, RLENGTH - 2); exit
            }')

          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator found on this runner."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator $udid"
          xcrun simctl list devices available | grep "$udid"

          xcodebuild test \
            -scheme RelavoiSDK \
            -destination "platform=iOS Simulator,id=$udid" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

  release-version:
    # Only on a tag. Fails the release if the tree disagrees with the tag: the
    # README install snippet and the newest CHANGELOG section must both name
    # the version being cut.
    #
    # v0.3.2 was tagged with a README still pointing at 0.3.1, the release
    # whose create() and list() crashed, and the tag had to be force-moved.
    # Moving a published tag is what this prevents: SwiftPM had already cached
    # the old revision and refused to resolve the moved one.
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: The tree agrees with the tag
        run: scripts/check-release-version.sh "${GITHUB_REF_NAME}"
